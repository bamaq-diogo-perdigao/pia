<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIA</title><link rel="stylesheet" href="/pia/style.css"><script type="module" src="/pia/app.js"></script></head>
<body><div id="workspace">
  <nav id="rail" aria-label="Atividades"><div id="primary-activities"></div><div id="app-activities"></div><div class="rail-bottom"><button data-view="settings" title="Configurações" aria-label="Configurações" data-icon="settings"></button></div></nav>
  <aside id="sidebar"><header><span id="section-title">Conversas</span><span id="header-actions"></span><button id="collapse" title="Recolher lista" aria-label="Recolher lista">‹</button></header><div id="sidebar-content"></div><div id="sidebar-footer"></div></aside>
  <main><header id="topbar"><button id="expand-sidebar" title="Exibir lista" aria-label="Exibir lista">☰</button><span id="view-title">PIA</span><span class="local-badge">Seu espaço pessoal</span></header>
  <section id="chat-view" class="view"><div id="messages" role="log" aria-live="polite"></div><div id="composer-area"><div id="composer"><textarea id="prompt" rows="1" aria-label="Mensagem" placeholder="Pergunte à PIA ou dê um comando…"></textarea><div class="composer-tools"><button id="microphone" title="Ditar no campo de mensagem" aria-label="Ditar no campo de mensagem" data-icon="mic"></button><span>Shift + Enter para uma nova linha</span><button id="send" class="primary" title="Enviar mensagem" aria-label="Enviar mensagem" data-icon="send"></button></div></div><p class="footnote">A PIA pode cometer erros. Confira informações importantes.</p></div></section>
  <section id="content-view" class="view" hidden></section><iframe id="app-frame" class="view" title="Aplicativo PIA" hidden></iframe>
  </main></div><div id="toast" role="status"></div><dialog id="modal"><form method="dialog"><h2 id="modal-title"></h2><div id="modal-fields"></div><footer><button type="button" id="modal-cancel">Cancelar</button><button id="modal-confirm" value="ok" class="primary">Confirmar</button></footer></form></dialog>
</body></html>
